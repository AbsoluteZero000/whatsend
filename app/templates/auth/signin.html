<!DOCTYPE html>
<html lang="{{ lang|default('en') }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script nonce="{{ csp_nonce }}">try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
  <title>{{ _('Sign In') }} — EchoSend</title>
  <link rel="stylesheet" href="/static/css/app.css?v=23">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <h1 class="auth-brand"><span class="brand-word">Echo<span>Send</span></span></h1>
        <h2>{{ _('Sign in') }}</h2>
      </div>
      <button type="button" class="theme-switch" role="switch" aria-checked="false" aria-label="{{ _('Dark mode') }}" title="{{ _('Dark mode') }}"><span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-icon">☀</span><span class="theme-switch-icon">☾</span><span class="theme-switch-thumb"></span></span></button>
    </div>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/auth/signin">
      <input type="text" name="username" placeholder="{{ _('Username') }}" required autocomplete="username">
      <input type="password" name="password" placeholder="{{ _('Password') }}" required autocomplete="current-password">
      <button type="submit">{{ _('Sign in') }}</button>
    </form>
    <p class="alt-link">{{ _("Don't have an account?") }} <a href="/auth/signup">{{ _('Sign up') }}</a></p>
  </div>
<script src="/static/js/security.js?v=1"></script>
<script src="/static/js/theme.js?v=1"></script>
</body>
</html>
