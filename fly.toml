app = "whatsend-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "15s"
    method = "GET"
    path = "/health/ready"

[[mounts]]
  source = "data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/whatsend.db"
  UPLOAD_DIR = "/data/uploads"
  COOKIE_SECURE = "true"
